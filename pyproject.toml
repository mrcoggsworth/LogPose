[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpose"
version = "0.1.0"
description = "Headless Security Orchestration Automation and Response platform for OpenShift"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LogPose Contributors"}]
license = {text = "MIT"}
keywords = ["soar", "security", "orchestration", "kafka", "rabbitmq"]

dependencies = [
    "pika>=1.3.1",                  # RabbitMQ client
    "confluent-kafka>=2.3",         # Kafka consumer
    "boto3>=1.28.0",                # AWS SQS consumer
    "google-cloud-pubsub>=2.18.0",  # GCP Pub/Sub
    "pydantic>=2.0.0",              # Data validation
    "python-dotenv>=1.0.0",         # Environment variables
    "requests>=2.31",               # N8N webhook client
    "splunk-sdk>=1.7",              # Splunk ES consumer
    "fastapi>=0.111",               # Universal HTTP consumer / dashboard
    "uvicorn[standard]>=0.29",      # ASGI server
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.9.0",
    "ruff>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: requires the docker compose stack (RabbitMQ, emulators)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
