# LogPose full-stack demo compose file.
#
# Start everything:
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Watch enriched alerts arrive at Splunk mock:
#   docker logs logpose-splunk-hec-mock -f
#
# Inject a test CloudTrail alert via HTTP:
#   curl -s -X POST http://localhost:8090/ingest \
#     -H "Content-Type: application/json" \
#     -d '{"raw_payload": {"eventName":"ConsoleLogin","eventSource":"signin.amazonaws.com","awsRegion":"us-east-1","userIdentity":{"type":"IAMUser","userName":"demo-user"},"sourceIPAddress":"1.2.3.4","responseElements":{"ConsoleLogin":"Success"}}}'
#
# RabbitMQ Management UI: http://localhost:15672  (guest / guest)
# Dashboard:              http://localhost:8080
# Splunk HEC mock:        http://localhost:8088/health

services:

  # ==========================================================================
  # Infrastructure
  # ==========================================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: logpose-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: logpose-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: logpose-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: logpose-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: logpose-pubsub-emulator
    command: >
      gcloud beta emulators pubsub start
      --project=logpose-dev
      --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/v1/projects/logpose-dev/topics"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # Splunk HEC mock  (log enriched alerts to stdout)
  # ==========================================================================

  splunk-hec-mock:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-splunk-hec-mock
    command: ["python", "/scripts/splunk_hec_mock.py"]
    volumes:
      - ./splunk_hec_mock.py:/scripts/splunk_hec_mock.py:ro
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # One-shot init: create LocalStack SNS/SQS resources and Pub/Sub topics
  # ==========================================================================

  logpose-setup:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-setup
    command: ["python", "/scripts/setup.py"]
    volumes:
      - ./setup.py:/scripts/setup.py:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: logpose-dev
    depends_on:
      localstack:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy
    restart: "no"

  # ==========================================================================
  # LogPose: consumers  (ingest layer)
  # ==========================================================================

  logpose-universal-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-universal-consumer
    command: ["python", "-m", "logpose.consumers.universal_consumer"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      UNIVERSAL_HTTP_HOST: "0.0.0.0"
      UNIVERSAL_HTTP_PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  logpose-kafka-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-kafka-consumer
    command: ["python", "-m", "logpose.consumers.kafka_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: logpose-consumers
      KAFKA_TOPICS: security-alerts
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  logpose-sqs-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-sqs-consumer
    command: ["python", "-m", "logpose.consumers.sqs_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/logpose-alerts
    depends_on:
      rabbitmq:
        condition: service_healthy
      logpose-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  logpose-pubsub-consumer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-pubsub-consumer
    command: ["python", "-m", "logpose.consumers.pubsub_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: logpose-dev
      PUBSUB_SUBSCRIPTION_ID: security-alerts-sub
    depends_on:
      rabbitmq:
        condition: service_healthy
      logpose-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # ==========================================================================
  # N8N workflow mock  (stands in for a real N8N instance)
  # ==========================================================================

  n8n-mock:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-n8n-mock
    command: ["python", "/scripts/n8n_workflow_mock.py"]
    volumes:
      - ./n8n_workflow_mock.py:/scripts/n8n_workflow_mock.py:ro
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5678/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # LogPose: router  (Phase II — routes alerts to workflow queues)
  # ==========================================================================

  logpose-router:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-router
    command: ["python", "-m", "logpose.router_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # LogPose: workflow workers  (Phase II — one pod per route, N8N enrichment)
  # ==========================================================================

  logpose-cloudtrail-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-cloudtrail-worker
    command: ["python", "-m", "logpose.workflows.worker_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOGPOSE_ROUTE: cloud.aws.cloudtrail
      N8N_WEBHOOK_URL: http://n8n-mock:5678/webhook/cloudtrail
    depends_on:
      rabbitmq:
        condition: service_healthy
      n8n-mock:
        condition: service_healthy
    restart: unless-stopped

  logpose-gcp-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-gcp-worker
    command: ["python", "-m", "logpose.workflows.worker_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOGPOSE_ROUTE: cloud.gcp.event_audit
      N8N_WEBHOOK_URL: http://n8n-mock:5678/webhook/gcp-event-audit
    depends_on:
      rabbitmq:
        condition: service_healthy
      n8n-mock:
        condition: service_healthy
    restart: unless-stopped

  logpose-test-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-test-worker
    command: ["python", "-m", "logpose.workflows.worker_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOGPOSE_ROUTE: test
      N8N_WEBHOOK_URL: http://n8n-mock:5678/webhook/test
    depends_on:
      rabbitmq:
        condition: service_healthy
      n8n-mock:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # LogPose: forwarder  (Phase III — ship enriched alerts to Splunk)
  # ==========================================================================

  logpose-forwarder:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-forwarder
    command: ["python", "-m", "logpose.forwarder_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SPLUNK_HEC_URL: http://splunk-hec-mock:8088/services/collector
      SPLUNK_HEC_TOKEN: demo-token
      SPLUNK_INDEX: logpose-demo
    depends_on:
      rabbitmq:
        condition: service_healthy
      splunk-hec-mock:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # LogPose: dashboard
  # ==========================================================================

  logpose-dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: logpose-dashboard
    command: ["python", "-m", "logpose.dashboard_main"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      METRICS_DB_PATH: /tmp/logpose_metrics.db
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
